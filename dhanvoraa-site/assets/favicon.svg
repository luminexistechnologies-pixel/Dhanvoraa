<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0d4a5c"/>
      <stop offset="100%" stop-color="#013443"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="40%" stop-color="#d99a29"/>
      <stop offset="100%" stop-color="#a06b10"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8e0e4"/>
      <stop offset="100%" stop-color="#8fa5b0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Gold D arc - outer curve -->
  <path d="M9 6 C9 6 20 6 22 16 C24 26 9 26 9 26 Z" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Gold D inner spine -->
  <line x1="9" y1="6" x2="9" y2="26" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Silver leaf accent -->
  <ellipse cx="11" cy="18" rx="2.5" ry="5" fill="url(#silver)" opacity="0.85" transform="rotate(-30 11 18)"/>
  <!-- Gold sphere -->
  <circle cx="14" cy="19" r="2" fill="url(#gold)"/>
  <circle cx="13.2" cy="18.2" r="0.6" fill="#fff8e1" opacity="0.6"/>
</svg>
